<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Representation loss and typed residue</title>
  <desc id="desc">A full process record enters a declared representation. Some target structure is recovered, while visible residue remains outside the representation and must be measured rather than ignored.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/><stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <pattern id="record" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M4 20L12 12L20 17M4 8L10 4L18 9" fill="none" stroke="#9dd7ff" stroke-opacity="0.55" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7cff6b"/>
    </marker>
  </defs>
  <rect width="960" height="340" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif">
    <text x="44" y="46" fill="#7cff6b" font-size="12" font-weight="700" letter-spacing="1.8">FULL PROCESS RECORD</text>
    <rect x="44" y="72" width="226" height="206" rx="18" fill="url(#record)" stroke="#9dd7ff" stroke-opacity="0.45"/>
    <path d="M86 228C112 202 118 160 150 144C180 128 198 98 230 88" fill="none" stroke="#7cff6b" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 144C180 168 190 196 208 242" fill="none" stroke="#5ef0a1" stroke-width="5" stroke-linecap="round"/>

    <path d="M292 176H374" stroke="#7cff6b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="300" y="160" fill="#aeb9c3" font-size="12">compress</text>

    <text x="398" y="46" fill="#7cff6b" font-size="12" font-weight="700" letter-spacing="1.8">DECLARED REPRESENTATION</text>
    <rect x="398" y="72" width="194" height="206" rx="18" fill="#0d161f" stroke="#c7ded8" stroke-opacity="0.28"/>
    <g stroke="#9dd7ff" stroke-width="2" fill="#071019">
      <circle cx="446" cy="118" r="13"/><circle cx="526" cy="114" r="13"/><circle cx="490" cy="178" r="13"/><circle cx="540" cy="230" r="13"/><circle cx="444" cy="238" r="13"/>
      <path d="M458 124L480 168M516 124L498 166M500 190L530 220M480 190L454 228"/>
    </g>
    <text x="442" y="304" fill="#aeb9c3" font-size="12">useful, bounded, incomplete</text>

    <path d="M614 176H696" stroke="#7cff6b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="620" y="160" fill="#aeb9c3" font-size="12">compare</text>

    <text x="720" y="46" fill="#7cff6b" font-size="12" font-weight="700" letter-spacing="1.8">RECOVERED + RESIDUE</text>
    <rect x="720" y="72" width="196" height="92" rx="18" fill="#7cff6b" fill-opacity="0.08" stroke="#7cff6b" stroke-opacity="0.45"/>
    <text x="744" y="108" fill="#f3f7f2" font-size="16" font-weight="700">Recovered target</text>
    <text x="744" y="136" fill="#aeb9c3" font-size="13">what the contract can support</text>
    <rect x="720" y="186" width="196" height="92" rx="18" fill="#f0b46a" fill-opacity="0.08" stroke="#f0b46a" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <text x="744" y="222" fill="#f3f7f2" font-size="16" font-weight="700">Typed residue</text>
    <text x="744" y="250" fill="#f0b46a" font-size="13">missing structure stays visible</text>
  </g>
</svg>
