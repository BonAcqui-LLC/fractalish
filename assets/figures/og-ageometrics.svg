<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ageometrics social card</title>
  <desc id="desc">Social card reading Ageometrics and Geometric Sufficiency Ratio with a schematic showing full record, geometric representation, and residue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1723"/>
      <stop offset="100%" stop-color="#0b1119"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="48" y="48" width="1104" height="534" rx="18" fill="#121a25" stroke="#334155"/>
  <text x="88" y="128" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="24">Fractalish Research Program</text>
  <text x="88" y="218" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="62">Ageometrics</text>
  <text x="88" y="278" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="34">The Geometric Sufficiency Ratio</text>
  <text x="88" y="346" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="25">What geometry preserves. What it erases. What must be added back.</text>
  <rect x="726" y="126" width="170" height="72" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <rect x="930" y="126" width="170" height="72" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <rect x="828" y="270" width="170" height="72" rx="12" fill="#16202d" stroke="#9db59a"/>
  <text x="811" y="170" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="24">Full record</text>
  <text x="1015" y="170" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="24">Geometry</text>
  <text x="913" y="314" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="24">Residue</text>
  <path d="M896 162H930" stroke="#8aa2c6" stroke-width="6"/>
  <polygon points="930,162 912,151 912,173" fill="#8aa2c6"/>
  <path d="M1015 198V250H913" stroke="#9db59a" stroke-width="6" fill="none"/>
  <polygon points="913,250 931,239 931,261" fill="#9db59a"/>
</svg>
