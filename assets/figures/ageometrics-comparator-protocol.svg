<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Comparator protocol diagram for GSR</title>
  <desc id="desc">A diagram showing the same cases, the same temporal boundary, and matched learner or capacity controls feeding baseline, geometry-only, and fuller-record risks, which then produce a GSR estimate with uncertainty.</desc>
  <rect width="1200" height="720" fill="#0b1119"/>
  <rect x="52" y="52" width="1096" height="616" rx="18" fill="#121a25" stroke="#334155"/>
  <text x="86" y="112" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="30">Comparator protocol</text>
  <rect x="92" y="156" width="1016" height="110" rx="12" fill="#111926" stroke="#8aa2c6"/>
  <text x="600" y="200" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Same held-out cases. Same temporal boundary. Same leakage rules.</text>
  <text x="600" y="236" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="20">Same-learner when possible. Capacity-matched when necessary. Model-envelope when prudent.</text>
  <rect x="118" y="350" width="250" height="120" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <rect x="474" y="350" width="250" height="120" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <rect x="830" y="350" width="250" height="120" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <text x="243" y="405" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Baseline risk</text>
  <text x="599" y="405" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Geometry-only risk</text>
  <text x="955" y="405" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Fuller-record risk</text>
  <text x="243" y="438" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">R_hat_Pi(B)</text>
  <text x="599" y="438" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">R_hat_Pi(G)</text>
  <text x="955" y="438" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">R_hat_Pi(X)</text>
  <path d="M243 470V530H600" stroke="#9db59a" stroke-width="5" fill="none"/>
  <path d="M955 470V530H600" stroke="#9db59a" stroke-width="5" fill="none"/>
  <polygon points="600,530 582,519 582,541" fill="#9db59a"/>
  <rect x="356" y="530" width="488" height="88" rx="12" fill="#16202d" stroke="#c8ae82"/>
  <text x="600" y="570" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="30">GSR estimate plus uncertainty</text>
  <text x="600" y="600" text-anchor="middle" fill="#c8ae82" font-family="Segoe UI, sans-serif" font-size="18">A result without this protocol is not an Ageometrics result.</text>
</svg>
