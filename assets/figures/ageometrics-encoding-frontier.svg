<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Geometric sufficiency versus encoding cost frontier</title>
  <desc id="desc">A chart with encoding cost on the horizontal axis and sufficiency on the vertical axis, showing diminishing returns as more record detail is injected into geometry.</desc>
  <rect width="1200" height="720" fill="#0b1119"/>
  <rect x="48" y="48" width="1104" height="624" rx="18" fill="#121a25" stroke="#334155"/>
  <line x1="142" y1="570" x2="1028" y2="570" stroke="#b2bccb" stroke-width="3"/>
  <line x1="142" y1="570" x2="142" y2="120" stroke="#b2bccb" stroke-width="3"/>
  <text x="585" y="636" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="30">Geometric encoding cost</text>
  <text x="48" y="344" transform="rotate(-90 48 344)" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="30">Geometric sufficiency</text>
  <path d="M168 500C254 446 336 380 408 320C478 262 560 220 654 188C744 158 842 142 982 132" fill="none" stroke="#8aa2c6" stroke-width="8"/>
  <circle cx="236" cy="452" r="10" fill="#c8ae82"/>
  <circle cx="470" cy="276" r="10" fill="#c8ae82"/>
  <circle cx="840" cy="148" r="10" fill="#c8ae82"/>
  <text x="236" y="430" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="18">cheap geometry</text>
  <text x="470" y="254" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="18">useful but incomplete</text>
  <text x="840" y="126" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="18">near-sufficient after augmentation</text>
  <rect x="716" y="266" width="314" height="158" rx="12" fill="#111926" stroke="#72543c"/>
  <text x="873" y="314" text-anchor="middle" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="28">Critical question</text>
  <text x="873" y="352" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="20">Does the geometry discover structure,</text>
  <text x="873" y="380" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="20">or merely warehouse the record</text>
  <text x="873" y="408" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="20">through extra labels, timestamps,</text>
  <text x="873" y="436" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="20">and auxiliary channels?</text>
  <g fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">
    <text x="128" y="576">0</text>
    <text x="126" y="136">1</text>
    <text x="968" y="594">high cost</text>
    <text x="166" y="594">low cost</text>
  </g>
</svg>
