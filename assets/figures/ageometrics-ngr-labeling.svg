<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Canonical and empirical NGR labeling</title>
  <desc id="desc">Two side-by-side panels distinguishing bounded canonical non-geometric residue from signed empirical non-geometric residue diagnostics.</desc>
  <rect width="1200" height="520" fill="#0b1119"/>
  <rect x="78" y="72" width="452" height="376" rx="18" fill="#121a25" stroke="#334155"/>
  <rect x="670" y="72" width="452" height="376" rx="18" fill="#121a25" stroke="#334155"/>
  <text x="304" y="134" text-anchor="middle" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="30">Canonical NGR*</text>
  <text x="896" y="134" text-anchor="middle" fill="#c89a72" font-family="Georgia, 'Times New Roman', serif" font-size="30">Empirical NGR_hat_Pi</text>
  <text x="304" y="206" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="22">1 - GSR*</text>
  <text x="896" y="206" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="22">1 - GSR_hat_Pi</text>
  <text x="304" y="264" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="20">bounded in [0,1] only under the canonical assumptions</text>
  <text x="896" y="264" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="20">signed protocol-relative diagnostic</text>
  <text x="304" y="322" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="20">population-level quantity</text>
  <text x="896" y="322" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="20">may be below 0 or above 1</text>
  <text x="304" y="380" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="24">Do not use this bounded reading automatically in finite samples.</text>
  <text x="896" y="380" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="24">Preserve the raw value and diagnose the interval violation.</text>
</svg>
