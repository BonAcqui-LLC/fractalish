<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">From recorded history to bounded evidence</title>
  <desc id="desc">A research schematic separates recorded local events, active constraints, present evidence, and typed residue. It emphasizes that one visible result can support a target without proving a unique history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7cff6b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9dd7ff"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9dd7ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="560" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="898" height="558" rx="23" fill="none" stroke="#9dd7ff" stroke-opacity="0.18"/>
  <rect x="20" y="20" width="860" height="520" rx="18" fill="url(#grid)"/>

  <text x="42" y="52" fill="#7cff6b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">1 / RECORDED LOCAL HISTORY</text>
  <text x="334" y="52" fill="#7cff6b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">2 / ACTIVE CONSTRAINTS</text>
  <text x="612" y="52" fill="#7cff6b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">3 / PRESENT EVIDENCE</text>

  <rect x="38" y="72" width="246" height="324" rx="14" fill="#07111a" stroke="#9dd7ff" stroke-opacity="0.22"/>
  <line x1="78" y1="104" x2="78" y2="354" stroke="#9dd7ff" stroke-opacity="0.25" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <circle cx="78" cy="120" r="8" fill="#7cff6b" filter="url(#soft-glow)"/>
    <text x="102" y="116" fill="#f3f7f2" font-size="14" font-weight="700">seed state</text>
    <text x="102" y="136" fill="#9aa9b5" font-size="12">known start condition</text>

    <circle cx="78" cy="185" r="8" fill="#9dd7ff"/>
    <text x="102" y="181" fill="#f3f7f2" font-size="14" font-weight="700">local move proposed</text>
    <text x="102" y="201" fill="#9aa9b5" font-size="12">route A continues</text>

    <circle cx="78" cy="250" r="8" fill="#f0b46a"/>
    <text x="102" y="246" fill="#f3f7f2" font-size="14" font-weight="700">route rejected</text>
    <text x="102" y="266" fill="#9aa9b5" font-size="12">barrier receipt retained</text>

    <circle cx="78" cy="315" r="8" fill="#9dd7ff"/>
    <text x="102" y="311" fill="#f3f7f2" font-size="14" font-weight="700">alternate route used</text>
    <text x="102" y="331" fill="#9aa9b5" font-size="12">resource cost recorded</text>

    <circle cx="78" cy="366" r="8" fill="#7cff6b"/>
    <text x="102" y="370" fill="#f3f7f2" font-size="14" font-weight="700">trace survives</text>
  </g>

  <path d="M 286 232 H 320" fill="none" stroke="#7cff6b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="328" y="72" width="244" height="324" rx="14" fill="#07111a" stroke="#9dd7ff" stroke-opacity="0.22"/>
  <g font-family="system-ui, sans-serif">
    <rect x="352" y="105" width="196" height="66" rx="10" fill="#101923" stroke="#f0b46a" stroke-opacity="0.52"/>
    <text x="370" y="132" fill="#f0b46a" font-size="12" font-weight="700" letter-spacing="1.5">BARRIER</text>
    <text x="370" y="153" fill="#cbd4dc" font-size="13">which moves are reachable?</text>

    <rect x="352" y="190" width="196" height="66" rx="10" fill="#101923" stroke="#9dd7ff" stroke-opacity="0.45"/>
    <text x="370" y="217" fill="#9dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">RESOURCE</text>
    <text x="370" y="238" fill="#cbd4dc" font-size="13">which moves remain affordable?</text>

    <rect x="352" y="275" width="196" height="66" rx="10" fill="#101923" stroke="#7cff6b" stroke-opacity="0.42"/>
    <text x="370" y="302" fill="#7cff6b" font-size="12" font-weight="700" letter-spacing="1.5">SCREENING</text>
    <text x="370" y="323" fill="#cbd4dc" font-size="13">which traces stay observable?</text>

    <text x="352" y="372" fill="#9aa9b5" font-size="12">Named conditions, not decorative rules.</text>
  </g>

  <path d="M 574 232 H 606" fill="none" stroke="#7cff6b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="612" y="72" width="250" height="324" rx="14" fill="#07111a" stroke="#9dd7ff" stroke-opacity="0.22"/>
  <g font-family="system-ui, sans-serif">
    <text x="636" y="107" fill="#f3f7f2" font-size="15" font-weight="700">Observed trace</text>
    <rect x="636" y="125" width="202" height="106" rx="10" fill="#0d1720" stroke="#7cff6b" stroke-opacity="0.32"/>
    <path d="M 660 202 L 690 174 L 724 185 L 756 150 L 810 166" fill="none" stroke="#7cff6b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="660" cy="202" r="5" fill="#9dd7ff"/>
    <circle cx="690" cy="174" r="5" fill="#9dd7ff"/>
    <circle cx="724" cy="185" r="5" fill="#f0b46a"/>
    <circle cx="756" cy="150" r="5" fill="#9dd7ff"/>
    <circle cx="810" cy="166" r="5" fill="#7cff6b"/>

    <text x="636" y="263" fill="#f3f7f2" font-size="15" font-weight="700">Typed residue</text>
    <rect x="636" y="278" width="62" height="30" rx="15" fill="#f0b46a" fill-opacity="0.12" stroke="#f0b46a" stroke-opacity="0.45"/>
    <text x="653" y="298" fill="#f0b46a" font-size="11" font-weight="700">ERASED</text>
    <rect x="706" y="278" width="71" height="30" rx="15" fill="#9dd7ff" fill-opacity="0.10" stroke="#9dd7ff" stroke-opacity="0.4"/>
    <text x="721" y="298" fill="#9dd7ff" font-size="11" font-weight="700">UNSEEN</text>
    <rect x="785" y="278" width="53" height="30" rx="15" fill="#7cff6b" fill-opacity="0.08" stroke="#7cff6b" stroke-opacity="0.35"/>
    <text x="797" y="298" fill="#7cff6b" font-size="11" font-weight="700">KEPT</text>
    <text x="636" y="337" fill="#cbd4dc" font-size="13">Useful for a declared target.</text>
    <text x="636" y="361" fill="#f0b46a" font-size="13" font-weight="700">Not proof of a unique history.</text>
  </g>

  <rect x="38" y="424" width="824" height="92" rx="14" fill="#09131b" stroke="#9dd7ff" stroke-opacity="0.18"/>
  <g font-family="system-ui, sans-serif">
    <text x="62" y="453" fill="#9dd7ff" font-size="11" font-weight="700" letter-spacing="1.5">EVIDENCE RECEIPT</text>
    <text x="62" y="485" fill="#f3f7f2" font-size="17" font-weight="700">history</text>
    <path d="M 126 479 H 166" stroke="#9dd7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="180" y="485" fill="#f3f7f2" font-size="17" font-weight="700">constraints</text>
    <path d="M 274 479 H 314" stroke="#9dd7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="328" y="485" fill="#f3f7f2" font-size="17" font-weight="700">representation</text>
    <path d="M 452 479 H 492" stroke="#9dd7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="506" y="485" fill="#f3f7f2" font-size="17" font-weight="700">target</text>
    <text x="586" y="485" fill="#7cff6b" font-size="17" font-weight="700">→ bounded claim</text>
  </g>
</svg>
