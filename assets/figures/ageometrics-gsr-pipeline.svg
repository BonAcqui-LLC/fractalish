<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ageometrics GSR pipeline diagram</title>
  <desc id="desc">A diagram showing a full record feeding both a geometric representation and a full-record model, with the difference between their task scores identified as measurable residue.</desc>
  <rect width="1200" height="720" fill="#0b1119"/>
  <rect x="48" y="48" width="1104" height="624" rx="18" fill="#121a25" stroke="#334155"/>
  <text x="84" y="112" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="28">Declared comparison</text>
  <rect x="82" y="170" width="240" height="110" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <text x="202" y="220" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="34">Full record X</text>
  <text x="202" y="252" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="19">history, provenance, context, intervention traces</text>
  <rect x="430" y="100" width="258" height="94" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <text x="559" y="145" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="30">G(X)</text>
  <text x="559" y="174" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">declared geometry</text>
  <rect x="430" y="240" width="258" height="94" rx="12" fill="#16202d" stroke="#8aa2c6"/>
  <text x="559" y="286" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Geometry-only model</text>
  <text x="559" y="315" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">best validated SG</text>
  <rect x="810" y="170" width="236" height="110" rx="12" fill="#16202d" stroke="#c8ae82"/>
  <text x="928" y="216" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="34">Target Y</text>
  <text x="928" y="248" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">score against the declared task</text>
  <rect x="430" y="412" width="258" height="94" rx="12" fill="#16202d" stroke="#9db59a"/>
  <text x="559" y="458" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="28">Full-record model</text>
  <text x="559" y="487" text-anchor="middle" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="18">best validated SX</text>
  <rect x="82" y="526" width="964" height="90" rx="12" fill="#111926" stroke="#72543c"/>
  <text x="564" y="564" text-anchor="middle" fill="#eef2f7" font-family="Georgia, 'Times New Roman', serif" font-size="31">GSR = (SG - S0) / (SX - S0)</text>
  <text x="564" y="596" text-anchor="middle" fill="#c89a72" font-family="Segoe UI, sans-serif" font-size="20">The remaining gap is reported as non-geometric residue relative to the declared representation.</text>
  <path d="M322 225H400" stroke="#8aa2c6" stroke-width="6" fill="none"/>
  <polygon points="400,225 382,214 382,236" fill="#8aa2c6"/>
  <path d="M688 147H776" stroke="#8aa2c6" stroke-width="6" fill="none"/>
  <polygon points="776,147 758,136 758,158" fill="#8aa2c6"/>
  <path d="M688 286H776" stroke="#8aa2c6" stroke-width="6" fill="none"/>
  <polygon points="776,286 758,275 758,297" fill="#8aa2c6"/>
  <path d="M322 225C380 225 392 225 430 225V459" stroke="#9db59a" stroke-width="6" fill="none"/>
  <polygon points="430,459 419,441 441,441" fill="#9db59a"/>
  <path d="M688 459H776" stroke="#9db59a" stroke-width="6" fill="none"/>
  <polygon points="776,459 758,448 758,470" fill="#9db59a"/>
  <text x="928" y="313" text-anchor="middle" fill="#c8ae82" font-family="Segoe UI, sans-serif" font-size="18">compare SG and SX under matched protocol</text>
</svg>
