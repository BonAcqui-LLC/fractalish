<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Fractalish constitutional evidence stack</title>
  <desc id="desc">A layered diagram connecting accumulated form, local process rules, changed accessibility, representation limits, specificity receipts, and physical traces under explicit public claim boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08101a"/>
      <stop offset="0.45" stop-color="#132031"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="45%" r="55%">
      <stop offset="0" stop-color="#9db59a" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#a8c2e8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .label{font:700 24px Georgia,serif;fill:#eef2f7}
      .small{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#b2bccb}
      .tiny{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#7cff6b;letter-spacing:.08em}
      .box{fill:rgba(18,26,37,.96);stroke:#526176;stroke-width:1.5;rx:18;filter:url(#shadow)}
      .soft{fill:rgba(168,194,232,.08);stroke:#7f98be;stroke-width:1.2;rx:14}
      .line{stroke:#a8c2e8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
      .line2{stroke:#7cff6b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
      .node{fill:#0f1723;stroke:#7cff6b;stroke-width:2}
      .green{stroke:#9db59a}
    </style>
  </defs>
  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect width="1400" height="780" fill="url(#glow)"/>
  <path d="M70 667 C215 548 306 552 418 420 C526 293 654 322 745 210 C828 108 1004 112 1212 72" stroke="#293b50" stroke-width="24" fill="none" opacity=".25"/>
  <path d="M82 660 C222 550 328 530 434 410 C544 284 663 318 756 204 C838 105 1006 120 1212 80" class="line" opacity=".28"/>
  <path d="M434 410 C388 318 336 263 238 202" class="line green" opacity=".42"/>
  <path d="M434 410 C474 310 500 238 514 142" class="line2" opacity=".44"/>
  <path d="M756 204 C834 276 924 314 1052 316" class="line green" opacity=".42"/>
  <path d="M756 204 C848 166 958 155 1090 186" class="line2" opacity=".42"/>

  <g transform="translate(70 70)">
    <rect class="box" width="345" height="170"/>
    <text class="tiny" x="24" y="35">ACCUMULATED FORM</text>
    <text class="label" x="24" y="72">Consequence made visible</text>
    <text class="small" x="24" y="106">Rivers, roots, cracks, scars,</text>
    <text class="small" x="24" y="128">dendrites, vascular trees, signals,</text>
    <text class="small" x="24" y="150">devices, and machine-state traces.</text>
  </g>

  <g transform="translate(525 52)">
    <rect class="box" width="350" height="175"/>
    <text class="tiny" x="24" y="35">LOCAL PROCESS RULES</text>
    <text class="label" x="24" y="72">Natural Math</text>
    <text class="small" x="24" y="106">Finite updates, thresholds, trails,</text>
    <text class="small" x="24" y="128">pressure, persistence, and bounded</text>
    <text class="small" x="24" y="150">growth under local information.</text>
  </g>

  <g transform="translate(980 70)">
    <rect class="box" width="335" height="170"/>
    <text class="tiny" x="24" y="35">CHANGED ACCESSIBILITY</text>
    <text class="label" x="24" y="72">Cognitive Basin</text>
    <text class="small" x="24" y="106">History-bearing state, scars,</text>
    <text class="small" x="24" y="128">domains, routing, recurrence,</text>
    <text class="small" x="24" y="150">HOLD, GUARD, SERA, replay.</text>
  </g>

  <g transform="translate(90 338)">
    <rect class="box" width="360" height="178"/>
    <text class="tiny" x="24" y="35">REPRESENTATION LIMITS</text>
    <text class="label" x="24" y="72">Ageometrics / VERITAS</text>
    <text class="small" x="24" y="106">What survives representation?</text>
    <text class="small" x="24" y="128">What residue remains visible?</text>
    <text class="small" x="24" y="150">What correction burden follows?</text>
  </g>

  <g transform="translate(520 328)">
    <rect class="box" width="365" height="190"/>
    <text class="tiny" x="24" y="35">RECEIPT GOVERNANCE</text>
    <text class="label" x="24" y="72">Specificity Thesis</text>
    <text class="small" x="24" y="106">Target receipts convert</text>
    <text class="small" x="24" y="128">declared recovery into</text>
    <text class="small" x="24" y="150">structural debt and repair posture.</text>
  </g>

  <g transform="translate(962 342)">
    <rect class="box" width="360" height="174"/>
    <text class="tiny" x="24" y="35">PHYSICAL REALIZATION</text>
    <text class="label" x="24" y="72">CNTM / Device Work</text>
    <text class="small" x="24" y="106">Morphology-bearing substrates,</text>
    <text class="small" x="24" y="128">sensors, handset evidence, and</text>
    <text class="small" x="24" y="150">durable memory traces.</text>
  </g>

  <g transform="translate(210 607)">
    <rect class="soft" width="980" height="96"/>
    <text class="tiny" x="28" y="34">PUBLIC CLAIM BOUNDARY</text>
    <text class="small" x="28" y="58">Strong evidence should be inspectable. Geometry is one instrument among others.</text>
    <text class="small" x="28" y="82">No claim here establishes sentience, personhood, medical authority, or universal decoding.</text>
  </g>

  <path d="M416 154 H525" class="line"/>
  <path d="M875 154 H980" class="line"/>
  <path d="M1148 240 C1120 306 1095 332 1082 342" class="line2"/>
  <path d="M982 429 H885" class="line"/>
  <path d="M520 424 H450" class="line"/>
  <path d="M701 518 V607" class="line2"/>
  <circle class="node" cx="416" cy="154" r="7"/>
  <circle class="node" cx="875" cy="154" r="7"/>
  <circle class="node" cx="982" cy="429" r="7"/>
  <circle class="node" cx="520" cy="424" r="7"/>
  <circle class="node" cx="701" cy="607" r="7"/>
</svg>
