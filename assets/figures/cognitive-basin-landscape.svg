<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Basin association landscape</title>
  <desc id="desc">Recurring domains form basins, reused associations thicken into routes, a contradiction scar blocks direct traversal, a recovery path forms around it, a HOLD region remains protected, and replay preserves the historical route.</desc>
