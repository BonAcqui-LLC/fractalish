    <path d="M92 392C164 336 202 286 246 224C302 146 384 136 460 184" stroke="#7cff6b" stroke-width="9" stroke-opacity="0.7"/>
    <path d="M460 184C520 226 544 300 620 326C704 354 764 324 820 266" stroke="#7cff6b" stroke-width="9" stroke-opacity="0.78" marker-end="url(#arrow)"/>
    <path d="M460 184C520 194 564 180 610 146" stroke="#9dd7ff" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M610 146C662 116 720 118 770 148" stroke="#9dd7ff" stroke-width="3" stroke-opacity="0.32"/>
  </g>

  <path d="M496 130C470 184 478 238 524 280" fill="none" stroke="#f0b46a" stroke-width="18" stroke-opacity="0.18"/>
  <path d="M496 130C470 184 478 238 524 280" fill="none" stroke="#f0b46a" stroke-width="5" stroke-dasharray="7 7"/>

