      <stop offset="0" stop-color="#102536"/><stop offset="1" stop-color="#020507"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7cff6b"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="28" fill="url(#field)"/>
  <g fill="none" stroke="#9dd7ff" stroke-opacity="0.16">
