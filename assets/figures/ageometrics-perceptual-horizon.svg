<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Perceptual horizon ladder</title>
  <desc id="desc">A ladder of perceptual horizon levels from contact-only awareness to predictive and counterfactual world modeling.</desc>
  <rect width="1200" height="760" fill="#0b1119"/>
  <rect x="86" y="84" width="1028" height="592" rx="18" fill="#121a25" stroke="#334155"/>
  <text x="120" y="140" fill="#c8ae82" font-family="Georgia, 'Times New Roman', serif" font-size="34">Perceptual horizon</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#eef2f7">
    <rect x="146" y="544" width="900" height="74" rx="10" fill="#16202d" stroke="#8aa2c6"/>
    <text x="196" y="590">H0</text>
    <text x="286" y="590">contact-only information</text>
    <rect x="206" y="468" width="840" height="62" rx="10" fill="#16202d" stroke="#8aa2c6"/>
    <text x="256" y="510">H1</text>
    <text x="346" y="510">immediate neighborhood</text>
    <rect x="286" y="394" width="760" height="58" rx="10" fill="#16202d" stroke="#8aa2c6"/>
    <text x="336" y="432">H2</text>
    <text x="426" y="432">finite-range sensing</text>
    <rect x="378" y="320" width="668" height="56" rx="10" fill="#16202d" stroke="#8aa2c6"/>
    <text x="428" y="356">H3</text>
    <text x="518" y="356">propagated field or network awareness</text>
    <rect x="486" y="246" width="560" height="56" rx="10" fill="#16202d" stroke="#8aa2c6"/>
    <text x="536" y="282">H4</text>
    <text x="626" y="282">global map</text>
    <rect x="606" y="172" width="440" height="56" rx="10" fill="#16202d" stroke="#c8ae82"/>
    <text x="656" y="208">H5</text>
    <text x="768" y="208">predictive and counterfactual world model</text>
  </g>
  <text x="132" y="676" fill="#b2bccb" font-family="Segoe UI, sans-serif" font-size="19">The Ageometric question is whether broader foresight improves local optimization while erasing recoverable developmental history from final structure.</text>
</svg>
