name: Ageometrics falsification or counterexample
description: Submit a benchmark, construction, or result that weakens or falsifies the proposal.
title: "[Ageometrics Falsification] "
labels:
  - hostile-review
  - ageometrics
body:
  - type: textarea
    id: claim
    attributes:
      label: Claim challenged
    validations:
      required: true
  - type: textarea
    id: representation
    attributes:
      label: Geometric representation
    validations:
      required: true
  - type: textarea
    id: fuller_record
    attributes:
      label: Declared fuller reference record
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Baseline
    validations:
      required: true
  - type: textarea
    id: comparator_protocol
    attributes:
      label: Comparator protocol
    validations:
      required: true
  - type: textarea
    id: component_risks
    attributes:
      label: Component risks
      description: Include baseline, geometry-only, and fuller-record risks or scores.
    validations:
      required: true
  - type: textarea
    id: raw_gsr_interval
    attributes:
      label: Raw GSR and interval
    validations:
      required: true
  - type: textarea
    id: failure_mode
    attributes:
      label: Failure mode
      description: State whether the result shows learner mismatch, metric redundancy, conceptual failure, or another failure mode.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it weakens or falsifies the proposal
    validations:
      required: true
