name: Hostile review
description: Submit skeptical critique, falsification pressure, or claim-boundary concerns.
title: "[Hostile Review] "
labels:
  - hostile-review
body:
  - type: textarea
    id: target
    attributes:
      label: Target of critique
      description: Page, document, repo area, tool, or claim.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Source / provenance
      description: Evidence, references, or examples supporting the critique.
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What claim it supports or challenges
    validations:
      required: true
  - type: dropdown
    id: routing
    attributes:
      label: MCVA / AMCVA / HOLD relevance
      options:
        - MCVA
        - AMCVA
        - HOLD
        - Mixed / unsure
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: Where your own critique is uncertain or domain-limited.
