name: Morphology example
description: Submit a candidate example image, trace, or morphology case.
title: "[Example] "
labels:
  - example
body:
  - type: input
    id: example_title
    attributes:
      label: Example title
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Source / provenance
      description: URL, publication, dataset, archive, or capture context.
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What claim it supports or challenges
    validations:
      required: true
  - type: dropdown
    id: routing
    attributes:
      label: MCVA / AMCVA / HOLD
      options:
        - MCVA
        - AMCVA
        - HOLD
        - Mixed / unsure
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
    validations:
      required: true
